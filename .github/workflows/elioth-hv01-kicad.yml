name: ELIOTH HV01 - KiCad validation
on:
  push:
    paths:
      - 'elioth/hv01_ctrl_9-12V/**'
      - '.github/workflows/elioth-hv01-kicad.yml'
  workflow_dispatch:

jobs:
  kicad-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install KiCad CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y kicad
          kicad-cli version
      - name: ERC, DRC and PDF
        shell: bash
        continue-on-error: true
        run: |
          mkdir -p validation
          BASE="elioth/hv01_ctrl_9-12V/ELIOTH_HV01_CTRL"
          kicad-cli sch erc -o validation/ERC.txt "${BASE}.kicad_sch" || true
          kicad-cli pcb drc -o validation/DRC.txt "${BASE}.kicad_pcb" || true
          kicad-cli sch export pdf -o validation/ELIOTH_HV01_esquematico.pdf "${BASE}.kicad_sch" || true
          kicad-cli pcb export svg -l F.Cu,B.Cu,Edge.Cuts,F.SilkS -o validation/ "${BASE}.kicad_pcb" || true
      - name: Upload review artifacts
        uses: actions/upload-artifact@v4
        with:
          name: elioth-hv01-kicad-revisao-nao-fabricar
          path: validation/
          if-no-files-found: warn
