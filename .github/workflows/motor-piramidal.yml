name: Motor Piramidal - campo livre
on:
  push:
    paths:
      - 'motor-piramidal/**'
      - '.github/workflows/motor-piramidal.yml'
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy
      - run: python motor-piramidal/simulate.py
      - uses: actions/upload-artifact@v4
        with:
          name: motor-piramidal-campo-livre
          path: motor-piramidal/results.csv
